<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Address Book • Wedding Manager</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='dash-sidebar.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='addressbook.css') }}">

  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Inject keys from Flask -->
  <script>
    window.SUPABASE_URL = "{{ supabase_url }}";
    window.SUPABASE_ANON_KEY = "{{ supabase_anon_key }}";
  </script>

  <!-- Members-only redirect -->
  <script src="{{ url_for('static', filename='auth-guard.js') }}"></script>

</head>

<body>
  <div class="appShell">
    <aside class="sidebar">
      <div class="sideTop">
        <div class="appTitle">Wedding Manager</div>
        <div class="eventLine">Emma &amp; Ethan • Jun 18, 2027</div>
      </div>
  
      <nav class="sideNav">
        <a href="/dashboard">Guest List</a>
        <a href="/address" class="withBadge active">
          Address Book
          <span class="badge" id="missingAddrBadge" style="display:none;">Missing</span>
        </a>
        <a href="/vendors" data-route="/vendors">Vendors</a>
        <a href="/export">Exports</a>
      </nav>
  
      <div class="sideBottom" style="position: relative;">
          <div class="userChip" id="userMenuTrigger" style="cursor: pointer;">
            <div class="userAvatar" id="userAvatarDisplay">EH</div>
            <div class="userText">
              <div class="userName" id="userNameDisplay">Emma Hernandez</div>
              <div class="userRole" id="userRoleDisplay">Bride</div>
            </div>
          </div>
        
          <div id="userRoleMenu" class="roleMenu" style="display: none;">
              <div class="roleMenuHeader">Switch View</div>
              <button type="button" class="roleMenuItem" data-role="admin">
                  <span class="roleIcon">EH</span>
                  <div class="roleDetails">
                      <span class="roleName">Emma Hernandez</span>
                      <span class="roleLabel">Bride (Admin)</span>
                  </div>
              </button>
              <button type="button" class="roleMenuItem" data-role="family">
                  <span class="roleIcon" style="background:#e0f2fe; color:#0369a1;">AE</span>
                  <div class="roleDetails">
                      <span class="roleName">Amy Eiduke</span>
                      <span class="roleLabel">Family (Restricted)</span>
                  </div>
              </button>
              <button type="button" class="roleMenuItem" data-role="viewer">
                  <span class="roleIcon" style="background:#f3fdf0; color:#338015;">IS</span>
                  <div class="roleDetails">
                      <span class="roleName">Isabel Hernandez</span>
                      <span class="roleLabel">Bridesmaid (View)</span>
                  </div>
              </button>
          </div>
        </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar__left">
          <h1 class="title">Address Book</h1>
          <p class="subtitle">For envelopes: copy addresses fast. For planning: missing ones are easy to spot.</p>
          <div id="statusLine" class="statusLine"></div>
        </div>
        <div class="topbar__right">
           </div>
      </header>
    
      <div class="container">
        <section class="toolbar" aria-label="Address filters">
          <div class="toolbar__left">
            <label class="field">
              <span class="field__label">Search</span>
              <input type="text" id="addrSearch" class="input" placeholder="Search party, guest, street, city..." />
            </label>
    
            <label class="field">
              <span class="field__label">View</span>
              <select id="addrScope" class="select">
                <option value="assigned">Your Guests</option>
                <option value="all">All Guests</option>
              </select>
            </label>
    
            <div class="segmented" role="tablist" style="margin-left: 12px;">
              <button class="segBtn filterBtn" data-filter="all">All</button>
              <button class="segBtn filterBtn is-active active" data-filter="missing">Missing</button>
              <button class="segBtn filterBtn" data-filter="complete">Complete</button>
            </div>
          </div>
        </section>
    
        <div id="abList" class="abList"></div> 
      </div>
    </main>
    
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="{{ url_for('static', filename='addressbook.js') }}" defer></script>
  <script src="{{ url_for('static', filename='dash-sidebar.js') }}" defer></script>
</body>
</html>
