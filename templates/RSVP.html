<!-- ==========================================
      NEW: ART MUSEUM / APPLICATION RSVP HERO
      ========================================== -->
<main class="rsvp-app-section" style="background-image: url('{{ url_for('static', filename='rsvp/Verdot_FRAMETV_AppleTree_2482.jpg') }}');">
  <div class="rsvp-backdrop-overlay"></div>
  
  <div class="rsvp-portal-card">
    <header class="rsvp-card-header">
      <span class="rsvp-kicker">June 18, 2027 • Shelbyville, MI</span>
      <h1 class="rsvp-title">RSVP</h1>
      <p class="rsvp-instructions">Enter your full name as it appears on your invitation to access your reservation.</p>
    </header>

    <!-- Change action to your Flask route (e.g., url_for('search_guest')) -->
    <form action="/rsvp/search" method="POST" class="rsvp-form" autocomplete="off">
      <div class="rsvp-input-wrapper">
        <input 
          type="text" 
          id="guest_name" 
          name="guest_name" 
          class="rsvp-minimal-input" 
          placeholder="First and Last Name" 
          required 
          aria-label="First and Last Name"
        >
        <button type="submit" class="rsvp-submit-btn" aria-label="Search Invitation">
          <i class="bi bi-arrow-right"></i>
        </button>
      </div>
    </form>

    <footer class="rsvp-card-footer">
      <div class="rsvp-divider"></div>
      <a href="/rsvp/lookup" class="rsvp-modify-link">
        <span class="modify-label">Need to make changes?</span> 
        <span class="modify-action">Modify an existing RSVP &rarr;</span>
      </a>
    </footer>
  </div>
</main>
  

<script src="{{ url_for('static', filename='event.js') }}" defer></script>

</body>
